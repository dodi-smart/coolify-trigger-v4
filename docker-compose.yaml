# Coolify Docker Compose resource aligned with Coolify v4 catalog
# (templates/compose/trigger.yaml) plus current official Trigger.dev
# hosting/docker services (s2-lite, clickhouse/clickhouse-server:26.2).
#
# Official source: https://github.com/triggerdotdev/trigger.dev/tree/main/hosting/docker
# Coolify catalog: https://github.com/coollabsio/coolify/blob/main/templates/compose/trigger.yaml
#
# Coolify parser rules encoded here:
#   - No top-level networks: (Coolify injects the resource UUID network).
#   - No per-service networks:.
#   - No ports:/expose: on `trigger` — Traefik port comes from SERVICE_URL_TRIGGER_3000.
#   - No Traefik labels, container_name, version:, restart: on long-running services.
#   - List-style environment. Bare SERVICE_URL_TRIGGER_3000 on `trigger` only.
#   - APP_ORIGIN uses unported ${SERVICE_URL_TRIGGER} (n8n pattern). Do not use
#     ${SERVICE_URL_TRIGGER_3000} for public origins — that appends :3000 and
#     breaks login (coollabsio/coolify#8638).
#   - Service `registry` is forbidden (Coolify maps it to docker-registry).
#   - docker.sock only on docker-proxy, read-only.
#   - `dockerregistry` gets its own domain via bare SERVICE_FQDN_DOCKERREGISTRY_5000.
#
# The bundled `dockerregistry` service is the default deploy registry: it is
# exposed with its own Coolify domain and TLS via Traefik, protected with
# htpasswd auth.
#
# Deploy from the Coolify UI. Never `docker compose up` under
# /data/coolify/applications/<uuid> or /data/coolify/services/<uuid>/.

services:
  trigger:
    image: ghcr.io/triggerdotdev/trigger.dev:${TRIGGER_IMAGE_TAG:-v4.5.12}
    user: root
    command: |
      sh -c "chown -R node:node /home/node/shared && exec ./scripts/entrypoint.sh"
    environment:
      - SERVICE_URL_TRIGGER_3000
      - APP_ORIGIN=${SERVICE_URL_TRIGGER}
      - LOGIN_ORIGIN=${SERVICE_URL_TRIGGER}
      - API_ORIGIN=${SERVICE_URL_TRIGGER}
      - ELECTRIC_ORIGIN=http://electric:3000
      - REALTIME_STREAMS_DEFAULT_VERSION=${REALTIME_STREAMS_DEFAULT_VERSION:-v2}
      - REALTIME_STREAMS_S2_BASIN=${REALTIME_STREAMS_S2_BASIN:-trigger-realtime}
      - REALTIME_STREAMS_S2_ENDPOINT=${REALTIME_STREAMS_S2_ENDPOINT:-http://s2/v1}
      - REALTIME_STREAMS_S2_SKIP_ACCESS_TOKENS=${REALTIME_STREAMS_S2_SKIP_ACCESS_TOKENS:-true}
      - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB:-main}?schema=public&sslmode=disable
      - DIRECT_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB:-main}?schema=public&sslmode=disable
      - SESSION_SECRET=${SERVICE_PASSWORD_64_SESSION}
      - MAGIC_LINK_SECRET=${SERVICE_PASSWORD_64_MAGICLINK}
      # SERVICE_PASSWORD is exactly 32 chars, matching Trigger.dev's exact-32-char
      # ENCRYPTION_KEY check. Do not use SERVICE_HEX_32 — older Coolify versions
      # (pre coollabsio/coolify#9820) generate 64 hex chars for it.
      - ENCRYPTION_KEY=${SERVICE_PASSWORD_ENCRYPTIONKEY}
      - PROVIDER_SECRET=${SERVICE_PASSWORD_64_PROVIDER}
      - COORDINATOR_SECRET=${SERVICE_PASSWORD_64_COORDINATOR}
      - MANAGED_WORKER_SECRET=${SERVICE_PASSWORD_64_WORKERSECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_TLS_DISABLED=true
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-info}
      - DEV_OTEL_EXPORTER_OTLP_ENDPOINT=${SERVICE_URL_TRIGGER}/otel
      # Bundled registry (assign a domain to dockerregistry in Coolify). Must be a real
      # FQDN — trigger.dev deploy silently skips pushing to localhost hosts (trigger.dev#3257).
      - DEPLOY_REGISTRY_HOST=${SERVICE_FQDN_DOCKERREGISTRY}
      - DEPLOY_REGISTRY_NAMESPACE=${DEPLOY_REGISTRY_NAMESPACE:-trigger}
      - OBJECT_STORE_BASE_URL=http://minio:9000
      - OBJECT_STORE_ACCESS_KEY_ID=${SERVICE_USER_MINIO}
      - OBJECT_STORE_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}
      - GRACEFUL_SHUTDOWN_TIMEOUT=1000
      # Node heap MB, ~80% of the container's RAM limit (app default 8192)
      - NODE_MAX_OLD_SPACE_SIZE=${NODE_MAX_OLD_SPACE_SIZE:-}
      - TRIGGER_BOOTSTRAP_ENABLED=1
      - TRIGGER_BOOTSTRAP_WORKER_GROUP_NAME=bootstrap
      - TRIGGER_BOOTSTRAP_WORKER_TOKEN_PATH=/home/node/shared/worker_token
      # ?secure=false is required on CLICKHOUSE_URL but must NOT be added to RUN_REPLICATION_CLICKHOUSE_URL (trigger.dev#3674)
      - CLICKHOUSE_URL=http://${SERVICE_USER_CLICKHOUSE}:${SERVICE_PASSWORD_64_CLICKHOUSE}@clickhouse:8123?secure=false
      - CLICKHOUSE_LOG_LEVEL=${CLICKHOUSE_LOG_LEVEL:-info}
      - RUN_REPLICATION_ENABLED=${RUN_REPLICATION_ENABLED:-1}
      - RUN_REPLICATION_CLICKHOUSE_URL=http://${SERVICE_USER_CLICKHOUSE}:${SERVICE_PASSWORD_64_CLICKHOUSE}@clickhouse:8123
      - RUN_REPLICATION_LOG_LEVEL=${RUN_REPLICATION_LOG_LEVEL:-info}
      # Store task events in ClickHouse (recommended). Set empty to keep events in Postgres.
      - EVENT_REPOSITORY_DEFAULT_STORE=${EVENT_REPOSITORY_DEFAULT_STORE:-clickhouse_v2}
      - INTERNAL_OTEL_TRACE_LOGGING_ENABLED=${INTERNAL_OTEL_TRACE_LOGGING_ENABLED:-0}
      - TRIGGER_TELEMETRY_DISABLED=${TRIGGER_TELEMETRY_DISABLED:-}
      - WHITELISTED_EMAILS=${WHITELISTED_EMAILS:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      # Email transport for magic-link login: resend (default), smtp, or aws-ses (see README)
      - EMAIL_TRANSPORT=${EMAIL_TRANSPORT:-resend}
      # Resend API key (re_...) — without it login links are only printed to the trigger container logs
      - RESEND_API_KEY=${RESEND_API_KEY}
      # Sender, e.g. "Trigger.dev <trigger@yourdomain.com>" — domain must be verified in Resend
      - FROM_EMAIL=${FROM_EMAIL}
      # Reply-to address for outgoing email
      - REPLY_TO_EMAIL=${REPLY_TO_EMAIL}
      # SMTP alternative — set EMAIL_TRANSPORT=smtp and fill these
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - AUTH_GITHUB_CLIENT_ID=${AUTH_GITHUB_CLIENT_ID:-}
      - AUTH_GITHUB_CLIENT_SECRET=${AUTH_GITHUB_CLIENT_SECRET:-}
      - DEFAULT_ENV_EXECUTION_CONCURRENCY_LIMIT=${DEFAULT_ENV_EXECUTION_CONCURRENCY_LIMIT:-}
      - DEFAULT_ORG_EXECUTION_CONCURRENCY_LIMIT=${DEFAULT_ORG_EXECUTION_CONCURRENCY_LIMIT:-}
    volumes:
      - shared-data:/home/node/shared
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/healthcheck',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      electric:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      s2:
        condition: service_healthy

  supervisor:
    image: ghcr.io/triggerdotdev/supervisor:${TRIGGER_IMAGE_TAG:-v4.5.12}
    user: root
    command: |
      sh -c "chown -R node:node /home/node/shared && exec /usr/bin/dumb-init -- pnpm run --filter supervisor start"
    environment:
      - TRIGGER_API_URL=http://trigger:3000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://trigger:3000/otel
      - TRIGGER_WORKER_TOKEN=file:///home/node/shared/worker_token
      - MANAGED_WORKER_SECRET=${SERVICE_PASSWORD_64_WORKERSECRET}
      - TRIGGER_WORKLOAD_API_DOMAIN=supervisor
      - TRIGGER_WORKLOAD_API_PORT_EXTERNAL=8020
      - DOCKER_HOST=tcp://docker-proxy:2375
      # Leave empty on the FIRST deploy; then set to the Coolify resource UUID network and redeploy (see README)
      - DOCKER_RUNNER_NETWORKS=${DOCKER_RUNNER_NETWORKS}
      - DOCKER_AUTOREMOVE_EXITED_CONTAINERS=${DOCKER_AUTOREMOVE_EXITED_CONTAINERS:-1}
      # Bundled registry endpoint (bare host, no scheme — upstream form)
      - DOCKER_REGISTRY_URL=${SERVICE_FQDN_DOCKERREGISTRY}
      - DOCKER_REGISTRY_USERNAME=${SERVICE_USER_DOCKERREGISTRY}
      - DOCKER_REGISTRY_PASSWORD=${SERVICE_PASSWORD_DOCKERREGISTRY}
      # DEBUG=1 leaks run env vars into supervisor logs (trigger.dev#3566)
      - DEBUG=${SUPERVISOR_DEBUG:-0}
      - ENFORCE_MACHINE_PRESETS=1
      - TRIGGER_DEQUEUE_INTERVAL_MS=1000
    volumes:
      - shared-data:/home/node/shared
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "require('http').get('http://127.0.0.1:8020/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      trigger:
        condition: service_healthy
      docker-proxy:
        condition: service_healthy

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LOG_LEVEL=info
      - POST=1
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - AUTH=1
      - DISTRIBUTION=1
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z 127.0.0.1 2375 || exit 1
      interval: 30s
      timeout: 5s
      retries: 5

  postgresql:
    image: postgres:${POSTGRES_IMAGE_TAG:-14}
    command:
      - "-c"
      - wal_level=logical
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-main}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5

  electric:
    image: electricsql/electric:${ELECTRIC_IMAGE_TAG:-1.2.4}
    environment:
      - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB:-main}?sslmode=disable
      - ELECTRIC_INSECURE=true
      - ELECTRIC_USAGE_REPORTING=false
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:3000/v1/health"
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgresql:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_IMAGE_TAG:-26.2}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_USER=${SERVICE_USER_CLICKHOUSE}
      - CLICKHOUSE_PASSWORD=${SERVICE_PASSWORD_64_CLICKHOUSE}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/data-paths.xml:/etc/clickhouse-server/config.d/data-paths.xml:ro
      - ./clickhouse/override.xml:/etc/clickhouse-server/config.d/override.xml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: bitnamilegacy/minio:${MINIO_IMAGE_TAG:-latest}
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
      - MINIO_DEFAULT_BUCKETS=packets
      - MINIO_BROWSER=off
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:9000/minio/health/live"
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  s2-init:
    image: busybox:${BUSYBOX_IMAGE_TAG:-1.37}
    # One-shot. Coolify would otherwise set unless-stopped and loop this container.
    # exclude_from_hc (Coolify-only key) excludes it from status monitoring.
    restart: "no"
    exclude_from_hc: true
    environment:
      - REALTIME_STREAMS_S2_BASIN=${REALTIME_STREAMS_S2_BASIN:-trigger-realtime}
    command:
      - sh
      - -c
      - |
        cat > /config/s2-spec.json <<JSON
        {
          "basins": [
            {
              "name": "$$REALTIME_STREAMS_S2_BASIN",
              "config": { "create_stream_on_append": true, "create_stream_on_read": true }
            }
          ]
        }
        JSON
        # Static busybox lets the distroless s2 image run a healthcheck probe.
        cp /bin/busybox /config/busybox
        chmod 755 /config/busybox
    volumes:
      - s2-config:/config

  s2:
    image: ${S2_IMAGE:-ghcr.io/s2-streamstore/s2:latest@sha256:d6ded5ca7dd619fa7c946f06e39a98f9c95c6883c8bb884e5eaa129f232c920c}
    user: "0:0"
    command: ["lite", "--init-file", "/config/s2-spec.json", "--local-root", "/data"]
    volumes:
      - s2-config:/config
      - s2-data:/data
    # Exec-form probe via the busybox binary s2-init copies into /config — the
    # image is distroless (no shell), so CMD-SHELL healthchecks cannot work here.
    healthcheck:
      test:
        - CMD
        - /config/busybox
        - wget
        - "-q"
        - "--spider"
        - "http://127.0.0.1:80/v1/basins"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      s2-init:
        condition: service_completed_successfully

  # Bundled registry, the default deploy registry. Not named `registry`
  # (Coolify special-cases that name) and not `docker-registry` (hyphens break
  # SERVICE_* keys).
  dockerregistry-init:
    image: httpd:${HTTPD_IMAGE_TAG:-2.4}
    restart: "no"
    exclude_from_hc: true
    environment:
      - REGISTRY_USER=${SERVICE_USER_DOCKERREGISTRY}
      - REGISTRY_PASSWORD=${SERVICE_PASSWORD_DOCKERREGISTRY}
    volumes:
      - dockerregistry-auth:/auth
    command:
      - sh
      - -c
      - |
        set -eu
        if [ -z "$$REGISTRY_PASSWORD" ]; then
          echo "SERVICE_PASSWORD_DOCKERREGISTRY is required for the bundled registry" >&2
          exit 1
        fi
        htpasswd -Bbn "$$REGISTRY_USER" "$$REGISTRY_PASSWORD" > /auth/htpasswd
        echo "Wrote bundled registry htpasswd for $$REGISTRY_USER"

  dockerregistry:
    image: registry:${REGISTRY_IMAGE_TAG:-2}
    environment:
      # Bare declaration: gives the registry its own Coolify domain + TLS, Traefik port 5000
      - SERVICE_FQDN_DOCKERREGISTRY_5000
      - REGISTRY_AUTH=htpasswd
      - REGISTRY_AUTH_HTPASSWD_REALM=Registry Realm
      - REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd
      - REGISTRY_HTTP_SECRET=${SERVICE_PASSWORD_REGISTRYHTTPSECRET}
    volumes:
      - dockerregistry-auth:/auth:ro
      - dockerregistry-data:/var/lib/registry
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:5000/v2/ 2>&1 || wget -q --spider -S http://127.0.0.1:5000/v2/ 2>&1 | grep -q "401"
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      dockerregistry-init:
        condition: service_completed_successfully

# Named volumes. Coolify's parser UUID-prefixes these on deploy. They are
# declared so this file is valid Compose (`docker compose config` / Git resources).
volumes:
  shared-data:
  postgresql-data:
  redis-data:
  clickhouse-data:
  minio-data:
  s2-config:
  s2-data:
  dockerregistry-auth:
  dockerregistry-data:
